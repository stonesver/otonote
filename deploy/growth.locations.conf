# Include inside the existing HTTPS server block. Never enable on plain HTTP.
location ^~ /api/growth-export/ {
    client_max_body_size 8k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    access_log /var/log/nginx/ournotes-growth.access.log ournotes_growth;
    error_log /var/log/nginx/ournotes-growth.error.log warn;
    proxy_pass http://127.0.0.1:18765;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 160s;
    proxy_next_upstream off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Request-ID $request_id always;
}
