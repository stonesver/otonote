# Include inside the existing HTTPS server block, BEFORE generic regex locations.
# Keep the existing /anontokyo/, QQ bot, ACME and certificate configuration.
location = /content/current.json {
    alias /srv/ournotes-updater/content/current.json;
    add_header Cache-Control "no-store" always;
}
location = /content/global/current.json {
    alias /srv/ournotes-updater/content/current.json;
    add_header Cache-Control "no-store" always;
}
location = /content/jp/current.json {
    alias /srv/ournotes-updater/content/jp/current.json;
    add_header Cache-Control "no-store" always;
}
location /content/ { return 404; }
location ~ "^/content/releases/[a-f0-9]{24}/(?:.*/)?\." { return 404; }
location ~* "^/content/.*\.(?:apk|credentials|secret)$" { return 404; }
location ~* "^/content/releases/([a-f0-9]{24})/(.+\.(?:moc3|mp3|m4a|aac|flac|wav|ogg|mp4|webm|mov))$" {
    alias /srv/ournotes-updater/content/releases/$1/$2;
    add_header Cache-Control "public, max-age=31536000, immutable";
    limit_conn ournotes_media_per_ip 8;
    limit_conn ournotes_media_global 24;
}
location ~ "^/content/releases/([a-f0-9]{24})/(.+)$" {
    alias /srv/ournotes-updater/content/releases/$1/$2;
    add_header Cache-Control "public, max-age=31536000, immutable";
    autoindex off;
}
location /app/ { return 404; }
location ~ "^/app/releases/[a-f0-9]{24}/(?:.*/)?\." { return 404; }
location ~ "^/app/releases/([a-f0-9]{24})/(.+)$" {
    alias /srv/ournotes-code/releases/$1/compiled/$2;
    add_header Cache-Control "public, max-age=31536000, immutable";
    autoindex off;
}
location ~ "^/(?:global|jp)/(?:zh-CN|en)/(vendor|brand|images)/(.+)$" {
    alias /srv/ournotes-code/current/compiled/$1/$2;
    add_header Cache-Control "no-cache";
}
location ~ "^/(?:global|jp)/(?:zh-CN|en)/favicon.svg$" {
    alias /srv/ournotes-code/current/compiled/favicon.svg;
}
# ournotes-prerender-jp-v1
location ~ "^/jp/(?:zh-CN|en)(?:/.*)?$" {
    if ($uri ~ "\.[^/]+$") { return 404; }
    root /srv/ournotes-rendered/current-jp;
    try_files $uri/index.html /__ournotes_frontend;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
location ~ "^/global/(?:zh-CN|en)(?:/.*)?$" {
    if ($uri ~ "\.[^/]+$") { return 404; }
    # ournotes-prerender-v1
    root /srv/ournotes-rendered/current;
    try_files $uri/index.html /__ournotes_frontend;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
location = /__ournotes_frontend {
    internal;
    alias /srv/ournotes-code/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
location /rendered/ { return 404; }
location ~ "^/rendered/releases/([a-f0-9]{24}-[a-f0-9]{24})/payloads/([a-f0-9]{64}\.json)$" {
    alias /srv/ournotes-rendered/releases/$1/payloads/$2;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
