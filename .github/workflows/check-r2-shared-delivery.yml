name: Check R2 shared delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: content-r2-production
    concurrency:
      group: r2-shared-delivery-probe
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: otonote-public-content
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install object client
        run: python -m pip install --disable-pip-version-check -r tools/r2-requirements.txt
      - name: Verify immutable test snapshot without changing current
        run: python -m tools.r2_delivery_probe --output "$RUNNER_TEMP/r2-shared-delivery.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-shared-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/r2-shared-delivery.json
          retention-days: 14
          if-no-files-found: error
