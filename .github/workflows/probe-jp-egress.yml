name: Probe JP version through configured egress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: content-r2-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only the pinned client metadata from private R2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PRIVATE_BUCKET: otonote-production-state
        run: |
          set -euo pipefail
          umask 077
          python -m pip install --disable-pip-version-check -r tools/r2-requirements.txt
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.jp_phone_inputs import JP_METADATA_SHA256
          from tools.r2_state import PrivateS3Bucket, object_key
          bucket = PrivateS3Bucket.from_environment()
          key = object_key(JP_METADATA_SHA256)
          size = bucket.client.head_object(Bucket=bucket.bucket, Key=key)['ContentLength']
          if not 0 < size <= 128 * 1024**2:
              raise SystemExit('Pinned JP metadata size is invalid')
          target = Path(os.environ['RUNNER_TEMP']) / 'jp-probe-metadata.dat'
          bucket.download_file(key, target, JP_METADATA_SHA256, size)
          print('Pinned JP client metadata verified; no R2 object changed')
          PY
      - name: Prepare the pinned proxy client
        shell: bash
        run: bash deploy/prepare-jp-egress.sh "$RUNNER_TEMP/jp-egress-client"
      - name: Make one trusted Version request
        shell: bash
        env:
          OURNOTES_JP_PROXY_NODE: ${{ secrets.OURNOTES_JP_PROXY_NODE }}
        run: |
          set -euo pipefail
          [[ -n "$OURNOTES_JP_PROXY_NODE" ]] || { echo 'Missing single-node JP egress secret' >&2; exit 1; }
          python -m tools.jp_version_egress --binary "$RUNNER_TEMP/jp-egress-client/mihomo" -- \
            python -m tools.jp_remote_sync probe --allow-client-builtin-credentials \
            --metadata "$RUNNER_TEMP/jp-probe-metadata.dat" --output "$RUNNER_TEMP/jp-version-probe.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jp-version-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jp-version-probe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove private client input
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/jp-probe-metadata.dat"
