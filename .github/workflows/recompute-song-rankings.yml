name: Recompute published song rankings

on:
  workflow_dispatch:
    inputs:
      region:
        description: Published edition to recompute
        required: true
        type: choice
        options: [global, jp]
      expected_current:
        description: SHA-256 of the exact existing current.json bytes
        required: true
        type: string
      model:
        description: Must match the reviewed scoring source
        required: true
        default: ournotes-native-score-v9
        type: string
      mode:
        description: Verify locally or publish the verified result
        required: true
        default: verify
        type: choice
        options: [verify, promote]

permissions:
  contents: read

jobs:
  recompute:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: content-r2-production
    concurrency:
      group: content-r2-${{ inputs.region }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified transport dependencies
        run: |
          python -m pip install --require-hashes -r tools/python-security-requirements.txt
          python -m pip install -r tools/r2-requirements.txt
      - name: Verify pinned inputs, recompute and optionally publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: otonote-public-content
          REGION: ${{ inputs.region }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          case "$MODE" in
            verify) ;;
            promote) options+=(--publish) ;;
            *) exit 1 ;;
          esac
          python -m tools.recompute_published_rankings \
            --region "$REGION" --expected-current "$EXPECTED_CURRENT" \
            --model "$MODEL" --source-run "rankings-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --work "$RUNNER_TEMP/ranking-refresh" "${options[@]}"
