name: Probe R2 credentials read only

on:
  workflow_dispatch:
    inputs:
      expected_restore_bytes:
        description: Verified private-state restore bytes; 0 reports capacity without a size gate
        type: string
        default: '0'

permissions:
  contents: read
  packages: read

jobs:
  probe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.CONTENT_R2_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: content-r2-production
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check both bucket scopes without writing
        shell: bash
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing Environment Secret: $name" >&2; exit 1; }
          done
          python -m pip install --disable-pip-version-check -r tools/r2-requirements.txt
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          client = boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto',
              config=Config(signature_version='s3v4', retries={'mode': 'standard', 'max_attempts': 3}),
          )
          for bucket, prefix in (
              ('otonote-production-state', 'state/'),
              ('otonote-public-content', 'content/'),
          ):
              result = client.list_objects_v2(Bucket=bucket, Prefix=prefix, MaxKeys=1)
              if result['ResponseMetadata']['HTTPStatusCode'] != 200:
                  raise SystemExit(f'{bucket}: unexpected R2 response')
              print(f'{bucket}: scoped read/list verified')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'- `{bucket}`: scoped read/list verified. No object was changed.\n')
          PY
      - name: Measure capacity after pulling the production image
        env:
          UPDATE_IMAGE: ${{ vars.OURNOTES_UPDATE_IMAGE }}
          EXPECTED_RESTORE_BYTES: ${{ inputs.expected_restore_bytes }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPDATE_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || {
            echo 'Expected a reviewed updater image pinned by digest' >&2; exit 1;
          }
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$UPDATE_IMAGE"
          df -h "$GITHUB_WORKSPACE"
          python - <<'PY'
          import os, shutil
          value = os.environ['EXPECTED_RESTORE_BYTES']
          if not value.isdecimal():
              raise SystemExit('expected_restore_bytes must be a nonnegative integer')
          restore = int(value)
          free = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free
          required = restore + 8 * 1024**3
          message = (f'Runner free after image pull: {free:,} bytes; '
                     f'private restore: {restore:,} bytes; '
                     f'restore plus production reserve: {required:,} bytes')
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'\n{message}.\n')
          if restore and free < required:
              raise SystemExit('Runner capacity gate failed; select a larger hosted runner before production')
          PY
