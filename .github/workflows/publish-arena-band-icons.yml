name: Publish reviewed Arena band badges
on:
  workflow_dispatch:
    inputs:
      images:
        description: JSON map of reviewed image paths to base64 PNG bytes
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: content-r2-production
    concurrency:
      group: arena-band-media
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transport dependencies
        run: |
          python -m pip install --require-hashes -r tools/python-security-requirements.txt
          python -m pip install -r tools/r2-requirements.txt
      - name: Verify and publish reviewed badges
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: otonote-public-content
          BAND_ICON_BYTES: ${{ inputs.images }}
        run: python -m tools.publish_arena_band_icons >> "$GITHUB_STEP_SUMMARY"
