name: Recompute published song rankings

on:
  workflow_dispatch:
    inputs:
      region:
        description: Published edition to recompute
        required: true
        type: choice
        options: [global, jp]
      expected_current:
        description: SHA-256 of the exact existing current.json bytes
        required: true
        type: string
      model:
        description: Must match the reviewed scoring source
        required: true
        default: ournotes-native-score-v9
        type: string
      mode:
        description: Verify locally or publish the verified result
        required: true
        default: verify
        type: choice
        options: [verify, promote]
      scoring_rules_sha256:
        description: Optional reviewed reference-rule repair digest in the private object store
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  recompute:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: content-r2-production
    concurrency:
      group: content-r2-${{ inputs.region }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified transport dependencies
        run: |
          python -m pip install --require-hashes -r tools/python-security-requirements.txt
          python -m pip install -r tools/r2-requirements.txt
      - name: Verify pinned inputs, recompute and optionally publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: otonote-public-content
          R2_PRIVATE_BUCKET: otonote-production-state
          REGION: ${{ inputs.region }}
          EXPECTED_CURRENT: ${{ inputs.expected_current }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
          RULES_SHA256: ${{ inputs.scoring_rules_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          case "$MODE" in
            verify) ;;
            promote) options+=(--publish) ;;
            *) exit 1 ;;
          esac
          if [[ -n "$RULES_SHA256" ]]; then
            python - "$RULES_SHA256" "$RUNNER_TEMP/scoring-rules.json" <<'PY'
          import hashlib, os, re, sys
          from pathlib import Path
          import boto3
          from botocore.config import Config
          expected, target = sys.argv[1:]
          if not re.fullmatch('[a-f0-9]{64}', expected):
              raise SystemExit('Invalid reviewed rule digest')
          client = boto3.client('s3',
              endpoint_url='https://' + os.environ['R2_ACCOUNT_ID'] + '.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'], region_name='auto',
              config=Config(connect_timeout=15, read_timeout=30,
                            retries={'mode':'standard','max_attempts':3}))
          response = client.get_object(Bucket=os.environ['R2_PRIVATE_BUCKET'],
                                       Key='state/objects/' + expected)
          body = response['Body']
          try:
              raw = body.read(16 * 1024 * 1024 + 1)
          finally:
              body.close()
          if len(raw) > 16 * 1024 * 1024 or hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('Rule repair input failed verification')
          Path(target).write_bytes(raw)
          PY
            options+=(--scoring-rules "$RUNNER_TEMP/scoring-rules.json"
                      --expected-rules-sha256 "$RULES_SHA256")
          fi
          python -m tools.recompute_published_rankings \
            --region "$REGION" --expected-current "$EXPECTED_CURRENT" \
            --model "$MODEL" --source-run "rankings-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --work "$RUNNER_TEMP/ranking-refresh" "${options[@]}"
