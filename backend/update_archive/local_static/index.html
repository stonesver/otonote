<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地资源历史库</title><link rel="stylesheet" href="/app.css"></head>
<body><main>
<header class="masthead"><div><p class="eyebrow">OTONOTE / LOCAL ARCHIVE</p><h1>资源历史库<span>本地</span></h1><p class="intro">保存每一次变化，查看留下来的内容。</p></div><div class="sync-note"><span class="dot"></span><span id="sync-state">正在读取本地资料…</span></div></header>
<div class="overview" aria-label="资源统计"><div><strong id="saved-count">—</strong><span>本地原件</span></div><div><strong id="complete-count">—</strong><span>分析完成</span></div><div><strong id="pending-count">—</strong><span id="pending-label">待处理</span></div><p>同步后自动解包 · 已保存的历史长期留存</p></div>
<form id="filters"><select id="scope" aria-label="资源范围"><option value="local">本地已保存</option><option value="all">全部资源索引</option></select><input id="query" placeholder="搜索文件名或资源路径…" aria-label="搜索资源路径"><select id="region" aria-label="区服"><option value="">全部区服</option><option value="global">国际服</option><option value="jp">日服</option></select><label class="check"><input type="checkbox" id="removed">仅移除记录</label><button class="primary">查询</button></form>
<p id="scope-help">仅显示本机已有原件的记录；完整清单请切换到“全部资源索引”。</p>
<p id="message" role="status" aria-live="polite"></p>
<div class="columns"><section class="library-panel" aria-label="更新记录"><div class="panel-heading"><h2>资源记录</h2><span id="result-count"></span></div><div id="entries"></div><nav id="pages" aria-label="资源分页"></nav></section><section id="detail" class="detail-panel" aria-label="历史详情"><div class="empty"><span class="empty-symbol">▧</span><h2>选择一份资源</h2><p>在左侧查看已保存的版本。<br>分析完成后，图片、文本和声音会显示在这里。</p></div></section></div>
</main><script src="/app.js" type="module"></script></body></html>
