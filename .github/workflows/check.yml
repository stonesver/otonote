name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan repository history for credentials
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: Check public source boundary
        run: python3 -m tools.repository_hygiene scan --root . --scope tracked
      - name: Build and verify candidate from the checked-out commit
        run: python3 -m tools.release_candidate --revision "$GITHUB_SHA" --output output/code-candidate
      - name: Build immutable program bundle
        run: python3 -m tools.runtime_bundle build --revision "$GITHUB_SHA" --output output/runtime-candidate
      - name: Existing public contract gates
        run: |
          npm --prefix site ci --ignore-scripts --no-audit --no-fund
          node --test site/tests/story-share.test.mjs site/tests/startup.test.mjs site/tests/independent-content.test.mjs site/tests/loading-shell.test.mjs site/tests/costumes.test.mjs
          node --test site/tests/event-song-ranking.test.mjs site/tests/event-yield-ui.test.mjs site/tests/event-search-cache.test.mjs
          node --test site/tests/edition-library.test.mjs site/tests/shared-song-rankings.test.mjs site/tests/card-skill-filtering.test.mjs
          node --test site/tests/loading-art-publication.test.mjs site/tests/prerender.test.mjs site/tests/navigation-feedback.test.mjs
          python3 -m unittest tests.test_item_acquisition tests.test_game_database tests.test_code_publication tests.test_operations tests.test_docs_status tests.test_global_update tests.test_prerender_publication tests.test_admin_upgrade.ManualStageTests tests.test_current_content_media tests.test_costumes tests.test_content_publication tests.test_bundle_decoder tests.test_global_remote_sync tests.test_current_resources tests.test_deployment_preservation -q
      - name: Publish reviewed artifact identifiers to the run summary
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name in ['output/code-candidate/verification.json', 'output/runtime-candidate/runtime.json']:
                  summary.write(f"{name}: `{hashlib.sha256(Path(name).read_bytes()).hexdigest()}`\n\n")
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: verified-candidates-${{ github.sha }}
          path: |
            output/code-candidate
            output/runtime-candidate
          if-no-files-found: error
          retention-days: 14
