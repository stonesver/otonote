name: Retry verified content publication

on:
  workflow_dispatch:
    inputs:
      region:
        description: Edition of the saved publication
        required: true
        type: choice
        options: [global, jp]
      publication:
        description: Original Actions run ID and attempt, such as 123456_1
        required: true
        type: string
      mode:
        description: Verify saved content or retry its pointer publication
        required: true
        default: verify
        type: choice
        options: [verify, promote]

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: content-r2-production
    concurrency:
      group: content-r2-${{ inputs.region }}
      cancel-in-progress: false
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: otonote-public-content
      REGION: ${{ inputs.region }}
      PUBLICATION: ${{ inputs.publication }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transport dependencies
        run: |
          python -m pip install --require-hashes -r tools/python-security-requirements.txt
          python -m pip install -r tools/r2-requirements.txt
      - name: Record publication attempt
        if: inputs.mode == 'promote'
        run: python -m tools.r2_run_record --status running
      - name: Verify or publish the saved artifact
        id: promote
        run: |
          set -euo pipefail
          python -m tools.r2_publication "$MODE" --region "$REGION" \
            --publication "$PUBLICATION" --source-run "retry-${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record publication result
        if: always() && inputs.mode == 'promote'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_STEPS: ${{ toJSON(steps) }}
        run: python -m tools.r2_run_record --status "$JOB_STATUS"
